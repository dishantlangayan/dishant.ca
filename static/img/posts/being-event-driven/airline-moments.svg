<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1e293b">One journey, three moments that matter</text>
  <line x1="80" y1="170" x2="820" y2="170" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>
  <polygon points="820,160 840,170 820,180" fill="#cbd5e1"/>
  <g>
    <circle cx="170" cy="170" r="20" fill="#0d9488"/>
    <text x="170" y="120" text-anchor="middle" font-size="16" fill="#475569">EVENT</text>
    <text x="170" y="142" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Arriving at check-in</text>
    <rect x="60" y="215" width="220" height="140" rx="14" fill="#e6f6f4" stroke="#0d9488" stroke-width="2"/>
    <text x="170" y="250" text-anchor="middle" font-size="20" font-weight="700" fill="#0f766e">Upsell</text>
    <text x="170" y="282" text-anchor="middle" font-size="16" fill="#1e293b">Next cabin nearly empty?</text>
    <text x="170" y="306" text-anchor="middle" font-size="16" fill="#1e293b">Offer a discounted</text>
    <text x="170" y="330" text-anchor="middle" font-size="16" fill="#1e293b">upgrade right now</text>
  </g>
  <g>
    <circle cx="450" cy="170" r="20" fill="#d97706"/>
    <text x="450" y="120" text-anchor="middle" font-size="16" fill="#475569">EVENT</text>
    <text x="450" y="142" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Gate assigned</text>
    <rect x="340" y="215" width="220" height="140" rx="14" fill="#fdf3e3" stroke="#d97706" stroke-width="2"/>
    <text x="450" y="250" text-anchor="middle" font-size="20" font-weight="700" fill="#b45309">Inform</text>
    <text x="450" y="282" text-anchor="middle" font-size="16" fill="#1e293b">Push the gate number</text>
    <text x="450" y="306" text-anchor="middle" font-size="16" fill="#1e293b">and the walk time,</text>
    <text x="450" y="330" text-anchor="middle" font-size="16" fill="#1e293b">no board-watching</text>
  </g>
  <g>
    <circle cx="730" cy="170" r="20" fill="#4f46e5"/>
    <text x="730" y="120" text-anchor="middle" font-size="16" fill="#475569">EVENT</text>
    <text x="730" y="142" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Flight lands</text>
    <rect x="620" y="215" width="220" height="140" rx="14" fill="#eef0fd" stroke="#4f46e5" stroke-width="2"/>
    <text x="730" y="250" text-anchor="middle" font-size="20" font-weight="700" fill="#4338ca">Reward</text>
    <text x="730" y="282" text-anchor="middle" font-size="16" fill="#1e293b">"You've just reached</text>
    <text x="730" y="306" text-anchor="middle" font-size="16" fill="#1e293b">the next status tier"</text>
    <text x="730" y="330" text-anchor="middle" font-size="16" fill="#1e293b">while it still feels good</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
