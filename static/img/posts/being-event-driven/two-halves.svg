<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#1e293b">Being event-driven has two halves</text>
  <rect x="60" y="80" width="370" height="290" rx="18" fill="#e6f6f4" stroke="#0d9488" stroke-width="2"/>
  <rect x="470" y="80" width="370" height="290" rx="18" fill="#fdf3e3" stroke="#d97706" stroke-width="2"/>
  <text x="245" y="128" text-anchor="middle" font-size="24" font-weight="700" fill="#0f766e">Technology</text>
  <text x="245" y="154" text-anchor="middle" font-size="16" fill="#475569">how we build it</text>
  <g font-size="18" fill="#1e293b">
    <text x="110" y="205">• Event brokers &amp; event mesh</text>
    <text x="110" y="245">• Publish / subscribe</text>
    <text x="110" y="285">• Asynchronous services</text>
    <text x="110" y="325">• Event streams &amp; APIs</text>
  </g>
  <text x="655" y="128" text-anchor="middle" font-size="24" font-weight="700" fill="#b45309">Business</text>
  <text x="655" y="154" text-anchor="middle" font-size="16" fill="#475569">how we work</text>
  <g font-size="18" fill="#1e293b">
    <text x="515" y="205">• Business events that matter</text>
    <text x="515" y="245">• Processes triggered by events</text>
    <text x="515" y="285">• Capabilities organized</text>
    <text x="533" y="310">around events</text>
    <text x="515" y="345">• Acting in the moment</text>
  </g>
  <circle cx="450" cy="225" r="26" fill="#1e293b"/>
  <text x="450" y="233" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">+</text>
  <text x="450" y="402" text-anchor="middle" font-size="16" fill="#475569">Most teams invest in the left half. The value shows up when you add the right.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
