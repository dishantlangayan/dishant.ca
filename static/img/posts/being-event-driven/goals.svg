<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="450" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1e293b">Technology goals for becoming event-driven</text>
  <line x1="450" y1="250" x2="200" y2="150" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="450" y1="250" x2="700" y2="150" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="450" y1="250" x2="450" y2="370" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="60" y="85" width="280" height="120" rx="14" fill="#e6f6f4" stroke="#0d9488" stroke-width="2"/>
  <text x="200" y="122" text-anchor="middle" font-size="22" font-weight="700" fill="#0f766e">Agility</text>
  <text x="200" y="152" text-anchor="middle" font-size="16" fill="#1e293b">Flexible, scalable systems</text>
  <text x="200" y="176" text-anchor="middle" font-size="16" fill="#1e293b">and faster time to market</text>
  <rect x="560" y="85" width="280" height="120" rx="14" fill="#fdf3e3" stroke="#d97706" stroke-width="2"/>
  <text x="700" y="122" text-anchor="middle" font-size="22" font-weight="700" fill="#b45309">Efficiency</text>
  <text x="700" y="152" text-anchor="middle" font-size="16" fill="#1e293b">The right event to the right</text>
  <text x="700" y="176" text-anchor="middle" font-size="16" fill="#1e293b">app at the right time</text>
  <rect x="310" y="330" width="280" height="110" rx="14" fill="#eef0fd" stroke="#4f46e5" stroke-width="2"/>
  <text x="450" y="365" text-anchor="middle" font-size="22" font-weight="700" fill="#4338ca">Liberation</text>
  <text x="450" y="395" text-anchor="middle" font-size="16" fill="#1e293b">Break down silos so events</text>
  <text x="450" y="419" text-anchor="middle" font-size="16" fill="#1e293b">flow across the business</text>
  <circle cx="450" cy="235" r="78" fill="#1e293b"/>
  <text x="450" y="222" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Best</text>
  <text x="450" y="245" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">customer</text>
  <text x="450" y="268" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">experience</text>
