<rect x="675" y="160" width="64" height="76" rx="8" fill="#fff" stroke="#0d9488" stroke-width="2"/><text x="707" y="206" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">4c</text>
<rect x="760" y="160" width="64" height="76" rx="8" fill="#fff" stroke="#0d9488" stroke-width="2"/><text x="792" y="206" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">4c</text>
<rect x="505" y="260" width="64" height="76" rx="8" fill="#fff" stroke="#0d9488" stroke-width="2"/><text x="537" y="306" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">4c</text>
<rect x="590" y="260" width="64" height="76" rx="8" fill="#fff" stroke="#0d9488" stroke-width="2"/><text x="622" y="306" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">4c</text>
<rect x="675" y="260" width="64" height="76" rx="8" fill="#fff" stroke="#0d9488" stroke-width="2"/><text x="707" y="306" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">4c</text>
<rect x="760" y="260" width="64" height="76" rx="8" fill="#fff" stroke="#0d9488" stroke-width="2" stroke-dasharray="6 5"/><text x="792" y="306" text-anchor="middle" font-size="18" font-weight="700" fill="#0f766e">+</text>
<text x="665" y="380" text-anchor="middle" font-size="15" font-weight="400" fill="#475569">add commodity nodes as demand grows</text>
