<line x1="289" y1="330" x2="311" y2="330" stroke="#d97706" stroke-width="2.5" marker-end="url(#aa)"/>
<rect x="315" y="150" width="80" height="220" rx="8" fill="#fff" stroke="#d97706" stroke-width="2"/><text x="355" y="390" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">128 cores</text>
<rect x="470" y="70" width="390" height="330" rx="16" fill="#e6f6f4" stroke="#0d9488" stroke-width="2"/><text x="665" y="102" text-anchor="middle" font-size="19" font-weight="700" fill="#0f766e">Scale out (horizontal)</text>
<rect x="505" y="160" width="64" height="76" rx="8" fill="#fff" stroke="#0d9488" stroke-width="2"/><text x="537" y="206" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">4c</text>
