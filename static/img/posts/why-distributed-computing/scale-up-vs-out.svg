<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Scaling up adds cores to one machine until it hits a hardware or budget ceiling; scaling out adds more commodity machines as demand grows" xmlns:c2pa="http://c2pa.org/manifest">
<title>Scaling up adds cores to one machine until it hits a hardware or budget ceiling; scaling out adds more commodity machines as demand grows</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="430" fill="#ffffff"/>
<text x="450.0" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">Scaling up vs scaling out</text>
<rect x="40" y="70" width="390" height="330" rx="16" fill="#fdf3e3" stroke="#d97706" stroke-width="2"/><text x="235" y="102" text-anchor="middle" font-size="19" font-weight="700" fill="#b45309">Scale up (vertical)</text>
<line x1="70" y1="140" x2="400" y2="140" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 6"/><text x="400" y="132" text-anchor="end" font-size="14" font-weight="600" fill="#dc2626">hardware / budget ceiling</text>
<rect x="95" y="300" width="80" height="70" rx="8" fill="#fff" stroke="#d97706" stroke-width="2"/><text x="135" y="390" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">4 cores</text>
<line x1="179" y1="330" x2="201" y2="330" stroke="#d97706" stroke-width="2.5" marker-end="url(#aa)"/>
