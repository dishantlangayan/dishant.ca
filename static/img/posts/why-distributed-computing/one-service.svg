<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="A user sees one checkout service, but behind it six processes run across a Toronto data centre and a Frankfurt cloud region, talking over the network" xmlns:c2pa="http://c2pa.org/manifest">
<title>A user sees one checkout service, but behind it six processes run across a Toronto data centre and a Frankfurt cloud region, talking over the network</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="450" fill="#ffffff"/>
<text x="450.0" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">Many processes, one service</text>
<rect x="40" y="175" width="130" height="80" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="105.0" y="209.45" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">User</text>
