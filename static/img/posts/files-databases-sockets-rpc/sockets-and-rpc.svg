<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Raw sockets send bytes to a known IP and port; RPC wraps the socket in stubs so a remote call looks local, but the caller still waits on a server that must be up" xmlns:c2pa="http://c2pa.org/manifest">
<title>Raw sockets send bytes to a known IP and port; RPC wraps the socket in stubs so a remote call looks local, but the caller still waits on a server that must be up</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="430" fill="#ffffff"/>
<text x="450.0" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">Going over the network</text>
<rect x="30" y="65" width="405" height="340" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="232" y="98" text-anchor="middle" font-size="19" font-weight="700" fill="#0f766e">Raw sockets</text>
<rect x="55" y="150" width="120" height="64" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="115.0" y="187.6" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Process 1</text>
<rect x="290" y="150" width="120" height="64" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="350.0" y="176.6" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Process 2</text>
<text x="350.0" y="198.6" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">10.0.4.17:9000</text>
<line x1="178" y1="182" x2="286" y2="182" stroke="#0d9488" stroke-width="3" marker-end="url(#at)"/>
<text x="232" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#0f766e">bytes</text>
<text x="232" y="270" text-anchor="middle" font-size="16" font-weight="400" fill="#1e293b">Data arriving is the trigger.</text>
<text x="232" y="296" text-anchor="middle" font-size="15" font-weight="400" fill="#475569">But you write the framing, retries,</text>
<text x="232" y="320" text-anchor="middle" font-size="15" font-weight="400" fill="#475569">reconnects and serialisation yourself,</text>
<text x="232" y="344" text-anchor="middle" font-size="15" font-weight="400" fill="#475569">and you need the IP and port.</text>
<rect x="465" y="65" width="405" height="340" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="667" y="98" text-anchor="middle" font-size="19" font-weight="700" fill="#4338ca">Remote procedure call</text>
<rect x="490" y="130" width="140" height="50" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="560.0" y="160.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Client code</text>
<rect x="705" y="130" width="140" height="50" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="775.0" y="160.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Server code</text>
<rect x="490" y="210" width="140" height="50" rx="12" fill="#eef0fd" stroke="#4f46e5" stroke-width="2"/>
<text x="560.0" y="240.25" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">Client stub</text>
<rect x="705" y="210" width="140" height="50" rx="12" fill="#eef0fd" stroke="#4f46e5" stroke-width="2"/>
<text x="775.0" y="240.25" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">Server stub</text>
<line x1="560" y1="182" x2="560" y2="207" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#ai)"/>
<line x1="775" y1="207" x2="775" y2="182" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#ai)"/>
<line x1="632" y1="235" x2="701" y2="235" stroke="#4f46e5" stroke-width="3" marker-end="url(#ai)"/>
<text x="667" y="285" text-anchor="middle" font-size="13" font-weight="600" fill="#4338ca">over the network</text>
<text x="667" y="318" text-anchor="middle" font-size="16" font-weight="400" fill="#1e293b">placeOrder(order) looks local.</text>
<text x="667" y="344" text-anchor="middle" font-size="15" font-weight="400" fill="#475569">The caller still waits, and still needs</text>
<text x="667" y="368" text-anchor="middle" font-size="15" font-weight="400" fill="#475569">the server to be up and findable.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
