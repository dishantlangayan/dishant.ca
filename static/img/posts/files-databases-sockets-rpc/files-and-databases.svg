<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="File-based and database-centric communication: process 1 writes a file or inserts a row, and process 2 has to keep polling to find out something changed" xmlns:c2pa="http://c2pa.org/manifest">
<title>File-based and database-centric communication: process 1 writes a file or inserts a row, and process 2 has to keep polling to find out something changed</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="470" fill="#ffffff"/>
<text x="450.0" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">Talking through a shared resource</text>
<rect x="30" y="65" width="405" height="380" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="232" y="98" text-anchor="middle" font-size="19" font-weight="700" fill="#b45309">File-based</text>
<rect x="55" y="140" width="120" height="64" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="115.0" y="177.6" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Process 1</text>
<rect x="290" y="140" width="120" height="64" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="350.0" y="177.6" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Process 2</text>
<rect x="150" y="290" width="165" height="80" rx="12" fill="#fdf3e3" stroke="#d97706" stroke-width="2"/>
<text x="232.5" y="324.6" text-anchor="middle" font-size="16" font-weight="700" fill="#b45309">orders.csv</text>
<text x="232.5" y="346.6" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">shared / NFS disk</text>
<line x1="115" y1="206" x2="180" y2="286" stroke="#d97706" stroke-width="2.5" marker-end="url(#aa)"/>
<text x="100" y="262" text-anchor="middle" font-size="14" font-weight="600" fill="#b45309">write file</text>
<line x1="285" y1="286" x2="350" y2="208" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#aa)"/>
<text x="365" y="262" text-anchor="middle" font-size="14" font-weight="600" fill="#b45309">poll for changes</text>
<text x="232" y="410" text-anchor="middle" font-size="15" font-weight="400" fill="#475569" font-style="italic">“Anything new yet? ...how about now?”</text>
<rect x="465" y="65" width="405" height="380" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="667" y="98" text-anchor="middle" font-size="19" font-weight="700" fill="#4338ca">Database-centric</text>
<rect x="490" y="140" width="120" height="64" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="550.0" y="177.6" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Process 1</text>
<rect x="725" y="140" width="120" height="64" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="785.0" y="177.6" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Process 2</text>
<rect x="585" y="290" width="165" height="80" rx="12" fill="#eef0fd" stroke="#4f46e5" stroke-width="2"/>
<text x="667.5" y="324.6" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">ORDERS table</text>
<text x="667.5" y="346.6" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">db-host:5432</text>
<line x1="550" y1="206" x2="615" y2="286" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#ai)"/>
<text x="535" y="262" text-anchor="middle" font-size="14" font-weight="600" fill="#4338ca">INSERT</text>
<line x1="720" y1="286" x2="785" y2="208" stroke="#4f46e5" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ai)"/>
<text x="800" y="262" text-anchor="middle" font-size="14" font-weight="600" fill="#4338ca">SELECT ... poll</text>
<text x="667" y="410" text-anchor="middle" font-size="15" font-weight="400" fill="#475569" font-style="italic">“Anything new yet? ...how about now?”</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
