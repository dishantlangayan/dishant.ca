<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Synchronous: the front end calls Orders, which calls Inventory, which calls Payments, so response time adds up to the slowest link. Asynchronous: the front end publishes to a broker and the consumers work in parallel" xmlns:c2pa="http://c2pa.org/manifest">
<title>Synchronous: the front end calls Orders, which calls Inventory, which calls Payments, so response time adds up to the slowest link. Asynchronous: the front end publishes to a broker and the consumers work in parallel</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="920" height="520" fill="#ffffff"/>
<text x="460.0" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">Synchronous chain vs asynchronous flow</text>
<text x="40" y="90" text-anchor="start" font-size="17" font-weight="700" fill="#1e293b">Synchronous: each call waits for the next</text>
<rect x="40" y="110" width="155" height="56" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="117.5" y="143.6" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Front end</text>
<line x1="198" y1="128" x2="250" y2="128" stroke="#0d9488" stroke-width="2.5" marker-end="url(#at)"/>
<line x1="250" y1="150" x2="198" y2="150" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#a)"/>
<rect x="255" y="110" width="155" height="56" rx="12" fill="#e6f6f4" stroke="#0d9488" stroke-width="2"/>
<text x="332.5" y="143.6" text-anchor="middle" font-size="16" font-weight="700" fill="#0f766e">Orders</text>
<line x1="413" y1="128" x2="465" y2="128" stroke="#0d9488" stroke-width="2.5" marker-end="url(#at)"/>
<line x1="465" y1="150" x2="413" y2="150" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#a)"/>
<rect x="470" y="110" width="155" height="56" rx="12" fill="#e6f6f4" stroke="#0d9488" stroke-width="2"/>
<text x="547.5" y="143.6" text-anchor="middle" font-size="16" font-weight="700" fill="#0f766e">Inventory</text>
<line x1="628" y1="128" x2="680" y2="128" stroke="#0d9488" stroke-width="2.5" marker-end="url(#at)"/>
<line x1="680" y1="150" x2="628" y2="150" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#a)"/>
<rect x="685" y="110" width="155" height="56" rx="12" fill="#e6f6f4" stroke="#0d9488" stroke-width="2"/>
<text x="762.5" y="143.6" text-anchor="middle" font-size="16" font-weight="700" fill="#0f766e">Payments</text>
<text x="40" y="210" text-anchor="start" font-size="14" font-weight="600" fill="#475569">Response time the user feels</text>
<rect x="40" y="222" width="100" height="30" rx="6" fill="#e6f6f4" stroke="#0d9488" stroke-width="2"/><text x="90.0" y="243" text-anchor="middle" font-size="14" font-weight="600" fill="#0f766e">80 ms</text>
<rect x="144" y="222" width="220" height="30" rx="6" fill="#e6f6f4" stroke="#0d9488" stroke-width="2"/><text x="254.0" y="243" text-anchor="middle" font-size="14" font-weight="600" fill="#0f766e">200 ms</text>
<rect x="368" y="222" width="340" height="30" rx="6" fill="#fdecec" stroke="#dc2626" stroke-width="2"/><text x="538.0" y="243" text-anchor="middle" font-size="14" font-weight="600" fill="#dc2626">slow: 1.2 s</text>
<text x="880" y="243" text-anchor="end" font-size="14" font-weight="700" fill="#dc2626">= slowest link</text>
<line x1="30" y1="285" x2="890" y2="285" stroke="#cbd5e1" stroke-width="2"/><text x="40" y="320" text-anchor="start" font-size="17" font-weight="700" fill="#1e293b">Asynchronous: publish, move on, get told later</text>
<rect x="40" y="370" width="170" height="60" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="125.0" y="394.6" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Front end</text>
<text x="125.0" y="416.6" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">“order received”</text>
<rect x="300" y="365" width="200" height="70" rx="12" fill="#eef0fd" stroke="#4f46e5" stroke-width="2"/>
<text x="400.0" y="405.95" text-anchor="middle" font-size="17" font-weight="700" fill="#4338ca">Broker</text>
<line x1="212" y1="400" x2="296" y2="400" stroke="#d97706" stroke-width="2.5" marker-end="url(#aa)"/>
<rect x="640" y="318" width="170" height="44" rx="12" fill="#e6f6f4" stroke="#0d9488" stroke-width="2"/>
<text x="725.0" y="345.25" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">Orders</text>
<line x1="502" y1="400" x2="636" y2="340" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#ai)"/>
<rect x="640" y="378" width="170" height="44" rx="12" fill="#e6f6f4" stroke="#0d9488" stroke-width="2"/>
<text x="725.0" y="405.25" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">Inventory</text>
<line x1="502" y1="400" x2="636" y2="400" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#ai)"/>
<rect x="640" y="438" width="170" height="44" rx="12" fill="#e6f6f4" stroke="#0d9488" stroke-width="2"/>
<text x="725.0" y="465.25" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">Payments</text>
<line x1="502" y1="400" x2="636" y2="460" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#ai)"/>
<text x="570" y="505" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">work happens in parallel, at each consumer's pace</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
