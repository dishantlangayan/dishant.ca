<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="The web front end calls POST /orders on the order service and POST /orders/{id}/cancel on the cancellation service, each at a known host and port" xmlns:c2pa="http://c2pa.org/manifest">
<title>The web front end calls POST /orders on the order service and POST /orders/{id}/cancel on the cancellation service, each at a known host and port</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="360" fill="#ffffff"/>
<text x="450.0" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">The same flow over HTTP</text>
<rect x="40" y="140" width="160" height="70" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="120.0" y="180.6" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Web front end</text>
<rect x="560" y="70" width="300" height="80" rx="12" fill="#e6f6f4" stroke="#0d9488" stroke-width="2"/>
<text x="710.0" y="104.6" text-anchor="middle" font-size="16" font-weight="700" fill="#0f766e">Order service</text>
<text x="710.0" y="126.6" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">orders-1.internal:8443</text>
<rect x="560" y="210" width="300" height="80" rx="12" fill="#fdf3e3" stroke="#d97706" stroke-width="2"/>
<text x="710.0" y="244.6" text-anchor="middle" font-size="16" font-weight="700" fill="#b45309">Cancellation service</text>
<text x="710.0" y="266.6" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">cancel-2.internal:8443</text>
<line x1="202" y1="165" x2="556" y2="110" stroke="#0d9488" stroke-width="2.5" marker-end="url(#at)"/>
<line x1="202" y1="190" x2="556" y2="250" stroke="#d97706" stroke-width="2.5" marker-end="url(#aa)"/>
<text x="380" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">POST /orders</text>
<text x="380" y="248" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">POST /orders/{id}/cancel</text>
<text x="450" y="330" text-anchor="middle" font-size="16" font-weight="400" fill="#475569">Simple and universal, but the caller needs an address and waits for the answer.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
