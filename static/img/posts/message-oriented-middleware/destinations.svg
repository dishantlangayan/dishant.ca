<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="The web front end sends to destinations orders/new and orders/cancel; the middleware routes each to the order processor or the cancellation processor" xmlns:c2pa="http://c2pa.org/manifest">
<title>The web front end sends to destinations orders/new and orders/cancel; the middleware routes each to the order processor or the cancellation processor</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="360" fill="#ffffff"/>
<text x="450.0" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">Messages have a destination</text>
<rect x="40" y="140" width="160" height="70" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="120.0" y="180.6" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Web front end</text>
<rect x="300" y="120" width="230" height="110" rx="16" fill="#eef0fd" stroke="#4f46e5" stroke-width="2"/>
<text x="415.0" y="180.95" text-anchor="middle" font-size="17" font-weight="700" fill="#4338ca">Messaging middleware</text>
<rect x="660" y="80" width="200" height="70" rx="12" fill="#e6f6f4" stroke="#0d9488" stroke-width="2"/>
<text x="760.0" y="120.6" text-anchor="middle" font-size="16" font-weight="700" fill="#0f766e">Order processor</text>
<rect x="660" y="210" width="200" height="70" rx="12" fill="#fdf3e3" stroke="#d97706" stroke-width="2"/>
<text x="760.0" y="250.6" text-anchor="middle" font-size="16" font-weight="700" fill="#b45309">Cancellation processor</text>
<line x1="202" y1="175" x2="296" y2="175" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="532" y1="160" x2="656" y2="115" stroke="#0d9488" stroke-width="2.5" marker-end="url(#at)"/>
<line x1="532" y1="195" x2="656" y2="245" stroke="#d97706" stroke-width="2.5" marker-end="url(#aa)"/>
<text x="590" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">orders/new</text>
<text x="590" y="260" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">orders/cancel</text>
<text x="450" y="320" text-anchor="middle" font-size="16" font-weight="400" fill="#475569">The front end names what it is sending, not where the receiver lives.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
