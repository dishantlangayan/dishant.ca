<text x="775.0" y="241.75" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">Order processor 2</text>
<text x="775.0" y="262.75" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">started for the peak</text>
<line x1="592" y1="170" x2="686" y2="122" stroke="#0d9488" stroke-width="2.5" marker-end="url(#at)"/>
<line x1="592" y1="200" x2="686" y2="247" stroke="#0d9488" stroke-width="2.5" marker-end="url(#at)"/>
<text x="450" y="330" text-anchor="middle" font-size="16" font-weight="400" fill="#475569">Fast publisher, slower consumers: the queue buffers, and you add</text>
<text x="450" y="354" text-anchor="middle" font-size="16" font-weight="400" fill="#475569">competing consumers to drain it, then scale back down.</text>
