<rect x="461" y="176" width="26" height="18" rx="3" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/><polyline points="461,176 474.0,185.9 487,176" fill="none" stroke="#4f46e5" stroke-width="2"/>
<rect x="500" y="176" width="26" height="18" rx="3" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/><polyline points="500,176 513.0,185.9 526,176" fill="none" stroke="#4f46e5" stroke-width="2"/>
