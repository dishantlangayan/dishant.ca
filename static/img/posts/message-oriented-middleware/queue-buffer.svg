<text x="115.0" y="179.6" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Front end</text>
<text x="115.0" y="201.6" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">launch-day burst</text>
