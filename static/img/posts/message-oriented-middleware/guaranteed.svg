<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="While the order processor is offline the middleware persists guaranteed messages; when it recovers, the backlog is delivered" xmlns:c2pa="http://c2pa.org/manifest">
<title>While the order processor is offline the middleware persists guaranteed messages; when it recovers, the backlog is delivered</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="900" height="400" fill="#ffffff"/>
<text x="450.0" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">Guaranteed messages survive a missing receiver</text>
<text x="40" y="90" text-anchor="start" font-size="16" font-weight="700" fill="#1e293b">1. Receiver goes down</text>
<rect x="40" y="110" width="150" height="60" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="115.0" y="145.6" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Front end</text>
<rect x="320" y="102" width="260" height="76" rx="16" fill="#eef0fd" stroke="#4f46e5" stroke-width="2"/><text x="450" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">Middleware (persisted)</text>
<rect x="395" y="142" width="26" height="18" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="2"/><polyline points="395,142 408.0,151.9 421,142" fill="none" stroke="#d97706" stroke-width="2"/>
<rect x="429" y="142" width="26" height="18" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="2"/><polyline points="429,142 442.0,151.9 455,142" fill="none" stroke="#d97706" stroke-width="2"/>
<rect x="463" y="142" width="26" height="18" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="2"/><polyline points="463,142 476.0,151.9 489,142" fill="none" stroke="#d97706" stroke-width="2"/>
<line x1="192" y1="140" x2="316" y2="140" stroke="#d97706" stroke-width="2.5" marker-end="url(#aa)"/>
<rect x="700" y="110" width="160" height="60" rx="12" fill="#fdecec" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/>
<text x="780.0" y="134.75" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">Order processor</text>
<text x="780.0" y="155.75" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">offline</text>
<line x1="582" y1="140" x2="696" y2="140" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="4 6" marker-end="url(#a)"/>
<text x="640" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">held</text>
<text x="40" y="250" text-anchor="start" font-size="16" font-weight="700" fill="#1e293b">2. Receiver (or a new copy) comes back</text>
<rect x="40" y="270" width="150" height="60" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="115.0" y="305.6" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Front end</text>
<rect x="320" y="262" width="260" height="76" rx="16" fill="#eef0fd" stroke="#4f46e5" stroke-width="2"/><text x="450" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">Middleware (persisted)</text>
<line x1="192" y1="300" x2="316" y2="300" stroke="#d97706" stroke-width="2.5" marker-end="url(#aa)"/>
<rect x="700" y="270" width="160" height="60" rx="12" fill="#e6f6f4" stroke="#0d9488" stroke-width="2"/>
<text x="780.0" y="294.75" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">Order processor</text>
<text x="780.0" y="315.75" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">recovered</text>
<line x1="582" y1="300" x2="696" y2="300" stroke="#0d9488" stroke-width="3" marker-end="url(#at)"/>
<rect x="625" y="270" width="26" height="18" rx="3" fill="#ffffff" stroke="#0d9488" stroke-width="2"/><polyline points="625,270 638.0,279.9 651,270" fill="none" stroke="#0d9488" stroke-width="2"/>
<rect x="655" y="270" width="26" height="18" rx="3" fill="#ffffff" stroke="#0d9488" stroke-width="2"/><polyline points="655,270 668.0,279.9 681,270" fill="none" stroke="#0d9488" stroke-width="2"/>
<text x="450" y="314" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">delivering backlog</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
