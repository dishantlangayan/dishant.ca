baseURL = "https://dishant.ca/"
title = "Dishant.ca"
theme = "cleanwhite"
languageCode = "en-us"
defaultContentLanguage = "en"
enableEmoji = true
preserveTaxonomyNames = true

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[pagination]
  pagerSize = 5

[params]
  header_image = "img/home-bg-london-1920.jpg"   # also used as og:image / twitter:image
  # Optimized variants of the header image, served by layouts/_partials/head.html
  # (WebP where supported, 960px versions on small screens).
  header_image_webp = "img/home-bg-london-1920.webp"
  header_image_small = "img/home-bg-london-960.jpg"
  header_image_small_webp = "img/home-bg-london-960.webp"
  header_image_position = "center 45%"
  # Alternate header photo (Sydney Harbour Bridge): swap the five lines above for these
  # and change sidebar_avatar to "img/sidebar-sydney.jpg".
  # header_image = "img/home-bg-sydney-1920.jpg"
  # header_image_webp = "img/home-bg-sydney-1920.webp"
  # header_image_small = "img/home-bg-sydney-960.jpg"
  # header_image_small_webp = "img/home-bg-sydney-960.webp"
  # header_image_position = "center 30%"
  SEOTitle = "Dishant.ca"
  description = "The way to get started is to quit talking and begin doing. -Walt Disney"
  keyword = "blog, developer, personal, Dishant Langayan"
  slogan = "The way to get started is to quit talking and begin doing."
  upstreamAttribution = true
  custom_css = ["css/site.css"]
  gtm_id = "GTM-MT9SRTMT"   # Google Tag Manager container

  image_404 = "img/404-bg.jpg"
  title_404 = "Page not found :("

  # Sidebar
  sidebar_about_description = "Dishant's personal blog website"
  sidebar_avatar = "img/sidebar-london.jpg"   # 480px-wide copy of the header photo
  # Top nav: categories are listed explicitly via additional_menus below
  omit_categories = true

  featured_tags = true
  featured_condition_size = 1
  friends = true
  about_me = true
  last_posts = true

  [params.social]
    rss = true
    github = "https://github.com/dishantlangayan"
    linkedin = "https://www.linkedin.com/in/dishantlangayan/"
    twitter = "https://twitter.com/dishantlangayan"
    facebook = "https://facebook.com/dishantlangayan"

  [[params.friend_link]]
    title = "Solace"
    href = "https://solace.com"

  [[params.additional_menus]]
    title = "EDA & Design Patterns"
    href = "/categories/eda-design-patterns"
  [[params.additional_menus]]
    title = "Agentic AI"
    href = "/categories/agentic-ai"
  [[params.additional_menus]]
    title = "Integration"
    href = "/categories/integration"
  [[params.additional_menus]]
    title = "SERIES"
    href = "/series"
  [[params.additional_menus]]
    title = "ARCHIVE"
    href = "/archive"
  [[params.additional_menus]]
    title = "ABOUT"
    href = "/about"

  [params.giscus]
    data_repo = "dishantlangayan/dishant.ca"
    data_repo_id = "R_kgDOIR6sjQ"
    data_category = "Comments"
    data_category_id = "DIC_kwDOIR6sjc4DLzkI"
    data_mapping = "pathname"
    data_reactions_enabled = "1"
    data_emit_metadata = "0"
    data_lang = "en"
    crossorigin = "anonymous"

[markup]
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 2
  [markup.highlight]
    style = "dracula"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
